    <script>
      /* 防白闪引导脚本（K-1 / ADR-012）：样式加载前同步解析并写入 <html data-theme>。
         只设 data-theme —— 令牌文件 :root 内已给 --bg 默认值 + html{background:var(--bg)}，
         故即使 CSS 未全量就绪也不会白闪。system 模式用系统偏好解析。 */
      (function () {
        try {
          var mode = 'dark';
          try {
            /* [V0.5.0] 新键 timing.theme 优先，回落老键 tickbar.theme（0.5.0 兼容，一版后删）。
               这处是内联 JS，**逃过类型检查**，也不经过 src/lib/storageKeys.ts：
               改动必须与 src/types/domain/constants.ts / src/lib/theme.ts 同批。
               这里只读不写——本脚本必须同步执行，搬运（回写新键）由首帧后的
               readCachedTheme() 完成（ARCHITECTURE §6.2）。 */
            var cached = localStorage.getItem('timing.theme');
            if (cached !== 'dark' && cached !== 'light' && cached !== 'system') {
              cached = localStorage.getItem('tickbar.theme');
            }
            if (cached === 'dark' || cached === 'light' || cached === 'system') mode = cached;
          } catch (e) {}
          var resolved = mode;
          if (mode === 'system') {
            var dark = true;
            try {
              dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            } catch (e) {}
            resolved = dark ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute('content', resolved);
        } catch (e) {
          /* 任何异常都回落到默认深色（html 已带 data-theme="dark"） */
        }
      })();
    </script>

/* =============================================================================
 * Timing — 02-theme-dark.css（语义层 · 深色主题，默认）
 * 拆自 design-tokens.css §1（ADR-017 单文件 ≤300 行）。
 * 载入顺序固定为 01 → 02 → 03 → 04 → 05，顺序改变会改变层叠结果（尤其 --input-placeholder）。
 * ========================================================================== */

/* =============================================================================
 * 1. 深色主题（默认）
 * ========================================================================== */
:root,
:root[data-theme="dark"] {
  color-scheme: dark;

  --bg-plate:    #0E0F12;
  --bg-inset:    #1B1E25;
  --bg-panel:    #0E1015;
  --bg-card:     #14161C;
  --bg-field:    #1B1E25;
  --bg-field-hi: #232833;
  --bg-seg:      #171A21;
  --bg-seg-on:   #262B36;

  --line:    rgba(255, 255, 255, 0.06);
  --line-2:  rgba(255, 255, 255, 0.10);
  --line-3:  rgba(255, 255, 255, 0.16);

  /* [V0.2.10] 文字一律纯白、零透明度（用户口径「所有文字都按照纯白，不要半透，看不清」）。
     层级感改由字号/字重/留白承担，不再靠灰阶：--ink-2/3/4 只作为语义别名保留，
     色值全部对齐 #FFFFFF，避免「看着像禁用」的灰字。 */
  --ink:    #FFFFFF;
  --ink-2:  #FFFFFF;
  --ink-3:  #FFFFFF;
  --ink-4:  #FFFFFF;

  /* 输入占位符是「还没写的提示」，纯白会和已输入内容混同，故单独留一档：仍是白色，只是提亮程度低。
     写在这里（而不是共享映射块）是因为 `:root[data-theme=…]` 的特异性高于 `:root`，能盖住共享值。 */
  --input-placeholder: rgba(255, 255, 255, 0.62);

  /* [V0.2.10] 随「去除整体阴影」一并去掉：任何状态的文字都不再挂暗影/描边，
     文字就是纯色平面。深色壁纸上更干净，浅色壁纸上的可读性交回给用户调 --ui-bg-opacity。 */
  --text-halo: none;

  --accent:      #4DA3E8;

  /* [V0.3.1] 高亮定位色（托盘双击时小条闪三下）。默认值 = 后端
     `timing.highlight_color` 的出厂值；用户可在设置里改，主窗收到双击事件时
     用行内样式覆盖本变量。 */
  --highlight-color: #4DA3E8;
  --accent-ink:  #8FC6F5;
  --accent-wash: color-mix(in srgb, #4DA3E8 14%, transparent);
  --accent-line: color-mix(in srgb, #4DA3E8 32%, transparent);

  --warn:        #E8A33D;
  --warn-wash:   color-mix(in srgb, #E8A33D 12%, transparent);
  --danger:      #E5484D;
  --danger-wash: color-mix(in srgb, #E5484D 12%, transparent);
  --ok:          #4CC38A;
  --ok-ink:      #06251A;

  --solid-bg:  #EDEFF3;
  --solid-ink: #0B0C10;
  --danger-solid: #E1292F;   /* dark: danger 实心底（白字 4.61:1；原 #E5484D 白字仅 3.91）*/

  --track:      rgba(255, 255, 255, 0.09);
  --scrim:      rgba(14, 15, 18, 0.56);
  /* [Timing 对齐 D6] --ring-track 已删：倒计时 SVG 轨道改用 currentColor 37%（batch2.css） */

  --glass-panel-bg: color-mix(in srgb, #0E0F12 calc(94% * var(--ui-bg-opacity)), transparent);
  --glass-hover-bg: color-mix(in srgb, #0E0F12 calc(74% * var(--ui-bg-opacity)), transparent);
  --inset-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.06);

  --shadow-flat:    none;
  --shadow-ring:    0 0 0 1px var(--line-2);
  /* [V0.2.10] 用户要求「去除整体阴影」：投影一律 none，界面回到纯平面。
     `--shadow-ring` 保留：0 模糊的 1px 细线是当描边用的，视觉上不算投影。 */
  --shadow-pop:     none;
  --shadow-plate:   none;
  --shadow-float:   none;
  --shadow-panel:   none;
  --shadow-balloon: none;
  /* 透明态文字/环投埃（对齐 Timing TextShadow）——同样是投影，随整体一并去掉 */
  --shadow-ink: none;
  --inset-top:      var(--inset-highlight);

  --grip-ink:   rgba(255, 255, 255, 0.55);   /* Timing 实绘 GlassInkDim 139/255（MainForm.cs:2238） */
  --focus-ring: 0 0 0 2px var(--bg-panel), 0 0 0 4px var(--accent);
  --focus-ring-danger: 0 0 0 2px var(--bg-panel), 0 0 0 4px var(--danger);
}

/* =============================================================================
 * 5. 计时数字规则（全项目最重要的一条排版规则，不可协商）
 * ========================================================================== */
.timer-digits {
  font-family: var(--font-mono);
  font-size: var(--text-num);
  line-height: var(--leading-num);
  font-weight: var(--weight-strong);
  letter-spacing: var(--tracking-base);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "zero" 1;
  font-variant-ligatures: none;
  min-width: 53px;                            /* MM:SS 定宽（对齐 Timing TimeW 53）*/
  text-align: right;
  white-space: nowrap;
  color: var(--ink);
  display: inline-block;
}
.timer-digits[data-hours="true"] { min-width: 72px; }
.timer-digits[data-size="lg"] {
  font-size: 28px;
  line-height: 1.15;
  letter-spacing: var(--tracking-tight);
}

/* =============================================================================
 * 6. focus-visible（永不被清除）与 reduced-motion
 * ========================================================================== */
:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
  border-radius: inherit;
}
/* 危险项的焦点环：必须按值匹配——`data-danger` 在菜单项上恒存在（值为 "true"/"false"），
   写成 `[data-danger]` 会让所有菜单项都套上红环。 */
.btn-danger:focus-visible,
[data-danger="true"]:focus-visible {
  box-shadow: var(--focus-ring-danger);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-instant: 0.01ms;
    --dur-quick:   0.01ms;
    --dur-exit:    0.01ms;
    --dur-base:    0.01ms;
    --dur-morph:   0.01ms;
  }
  .halo-breath,
  .ring-tick { animation: none !important; }
  * {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
  /* [V0.3.6] 删除两条死代码：`.ring[data-state="running"]{stroke-width:3px}` 与
     `.ring[data-state="paused"]{stroke-dasharray:4 3}`。`.ring` 是 <button>，stroke-*

}

</style><style type="text/css" data-vite-dev-id="D:/101-Workshop/261111-Timing/src/styles/app.css">/* =============================================================================
 * Timing — app.css（基础层与共享原语）
 * -----------------------------------------------------------------------------
 * P0：本文件**只允许**引用 var(--*) CSS 变量，禁止出现任何字面量色值
 *     （十六进制色值、色彩函数一律禁止，白色与黑色也不例外）。
 *     原始色值唯一合法出现处是 styles/design-tokens.css。
 * 结构：reset -> 透明置顶层 -> 按钮/开关/提示/错误 -> 焦点环（置于末尾以赢得同优先）
 * ========================================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  /* [ADR-020] 不再有 384×360 画布：根元素就是视口，浮层靠绝对定位向外长，
     真实窗口由 useWindowAutoFit 撑到「内容包围盒」。 */
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent; /* 透明置顶层：无背景、无 Mica/Acrylic */
  font-family: var(--font-ui);
  font-size: var(--text-base);
  line-height: var(--leading-body);
  color: var(--text-primary);
  text-shadow: var(--text-halo);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
  cursor: default;
}

#root {
  width: 100%;
  height: 100%;
}

/* 透明置层：空白区 click-through，仅可见元素接管指针 */
.layer {
  /* 必须是 fixed 而不是 relative：主窗真实窗口会被 useWindowAutoFit 撑到内容大小，
     流内元素一旦被 focus()/scrollIntoView 触发根滚动，布局坐标整体平移，
     浮层（尤其菜单）会跟着被推出窗口。
     固定在视口原点后，程序化滚动再也搬不动它，布局坐标 == 视口坐标恒成立。

     尺寸用 --fit-w / --fit-h（主窗 = 显示器工作区，非主窗 = 100vw/100vh）而**不是** 100%：
     100% 会让置层跟着真实窗口一起缩放，于是 absolute 子元素（尤其 .layer__stack 的
     shrink-to-fit）按「当前窗口宽度」排版 —— 窗口一缩、胶囊文字就换行、测量值更小、
     窗口继续缩，形成自我坍缩的正反馈（实测 174px 的胶囊塌到 128px，"新建事项"竖排）。
     用工作区做布局空间，坐标稳定、容量也 = 屏幕真实容量，浮层可以长到视口外，
     fixed 置层不被裁剪，getBoundingClientRect() 仍量得到真实矩形。 */
  position: fixed;
  top: 0;
  left: 0;
  width: var(--fit-w);
  height: var(--fit-h);
  pointer-events: none;
}

.layer__stack {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  /* [V0.2.3 · 2] 左内缩单独用 --pill-inset（6px），让小条与事项名+手柄整体更靠左 */

  pointer-events: none;
}

.layer__stack > * {
  pointer-events: auto;
}

/* [V0.3.1] 拖动期统一「抓取」光标的规则已删除：

  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
}

input,
select {
  font: inherit;
  color: inherit;
}

  font: inherit;

  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  height: var(--toast-h);
  padding: 0 var(--space-5);
  border-radius: var(--radius-chip);
  font-size: var(--text-sm);
  font-weight: var(--weight-emphasize);
  color: var(--text-primary);
  background: var(--surface-3);
  border: 1px solid transparent;
  transition:
    background-color var(--dur-quick) var(--ease-standard),
    color var(--dur-quick) var(--ease-standard),
    border-color var(--dur-quick) var(--ease-standard),
    transform var(--dur-instant) var(--ease-standard);

.btn:hover:not(:disabled) {
  background: var(--surface-4);
  transform: translateY(-1px);

.btn:active:not(:disabled) {
  transform: scale(0.98);

.btn:disabled {
  color: var(--text-disabled);
  cursor: not-allowed;

.btn--primary:hover:not(:disabled) {

.btn--secondary {

.btn--secondary:hover:not(:disabled) {

.btn--ghost {

.btn--danger {

/* ---- 提示条 ---- */
.notice {

.pill {

  display: flex;
  align-items: center;
  /* [V0.2.2 · 3] 内容左移贴齐：由居中对齐改回左对齐，环 / 计时数字 / 事项名 / 手柄
     从左侧内边距起排，不再被整条居中留出左空档 */

  gap: var(--space-2);
  height: var(--pill-h);
  min-width: var(--pill-w-min);
  max-width: var(--pill-w-max);
  padding: 0 var(--pill-pad-r) 0 var(--pill-pad-l);
  border-radius: var(--radius-pill);

    border-color var(--dur-quick) var(--ease-standard),

  width: var(--dot-size);
  height: var(--dot-size);
  display: grid;
  place-items: center;
  border-radius: var(--radius-full);
  color: var(--state-idle);

  inset: 0;
  width: 100%;
  height: 100%;

 * Timing V0.2.0 — todos-panel.css（事项窗口外壳 / 表头 / 记录行 / 底栏）

</style><style type="text/css" data-vite-dev-id="D:/101-Workshop/261111-Timing/src/styles/todos-pending.css">/* =============================================================================

.todo-sec__more {

  border-radius: var(--radius-sm);
  text-align: left;
  font-size: var(--text-xs);

.todo-sec__more:hover {

  color: var(--ink);
}

/* ------------------------------ 待办行 ------------------------------ */
/* [V0.3.9] 与「今日计时」记录行同构：名字（左）/ 时刻（右）/ 编辑态动作（行尾），
   左侧不再有圆点；整行可点 = 勾选切换，故给 pointer 光标。
   [V0.3.10] 编辑模式下名字与两枚时间胶囊**各自可点开改**（点哪改哪）；只读时胶囊只是读数。 */

  /* [V0.3.11] 与「今日计时」行**同一套三列**（用户口径「时间应显示在对应的开始时间列」）：

  text-decoration-color: var(--todo-overdue);
  text-decoration-thickness: 1px;

.todo-pend[data-done="true"] .todo-pend__title {
  color: var(--todo-name-done);
  text-decoration: line-through;
  text-decoration-color: var(--line-3);
}

/* ------------------------------ 时间胶囊 ------------------------------ */
/* [V0.3.10] 开启 / 截止各自可点编辑；[V0.3.11] 只读态改回**和「今日计时」行同一套读数**
   （等宽 11.5 / --ink-4 / 右对齐）：用户口径「显示格式应该和计时一样，没指定时间就右侧空白」。

  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: var(--text-mono);   /* [Timing 对齐 D10] NumEm 11.5 */
  font-variant-numeric: tabular-nums;
  color: var(--ink-4);

  height: 12px;

}

.todo-pend__mark[data-on="true"] {
  border-color: var(--color-warn);
  background: var(--color-warn);

.todo-pend__mark:hover {

}

.todo-pend__mark[data-on="true"]:hover {
  border-color: var(--color-warn);

   放在 note.css（在 app.css 之后加载）并用 !important，才能盖住控件级规则。 */

</style><style type="text/css" data-vite-dev-id="D:/101-Workshop/261111-Timing/src/styles/batch2.css">/* =============================================================================
 * Timing V0.2.0 — batch2.css（批2 浮层：小条倒计时环 / 倒计时自定义 / 常用事项）
 * -----------------------------------------------------------------------------
 * 依据 docs/design/pages-V0.2.0/{countdown-menu,common-items}.md。
 * P0：仅 var(--*)，零字面量色值。自绘玻璃复用于 menu.css 的 .menu 语言。
 * 提醒浮出卡见同目录 reminder.css（单文件 ≤300 行纪律）。
 * ========================================================================== */

/* ------------------------------ 小条：倒计时剩余提示色 ------------------------------ */
/* [Timing 对齐 D3] 裁决一：急迫态 = RingUrgent 红（非橙）；数字变红不闪（MainForm.cs:786-793） */
.pill .timer-digits[data-tone="warn"] {
  color: var(--color-danger);
}

/* [Timing 对齐 D4] 暂停即橙字（MainForm.cs:782-785，与暂停弧同源）；置于 warn 规则后，
   同权重下暂停优先（MainForm 先判 paused） */
.pill[data-state="paused"] .timer-digits {
  color: var(--color-warn);
}

/* ------------------------- 状态环弧（V0.3.6 统一结构，ADR-024 / V0.3.7 全状态单载体） ------------------------- */
/* 单一结构裁决：**每一种状态**都渲染同一个 `<svg>` + 同一条 ARC_PATH，`border` 彻底退场
   （`.ring` 的 border 已归零，见 surfaces.css）。V0.3.7 之前 idle / ended 是例外——
   它们走 CSS border-radius，也就是「圆角矩形」，与 SVG 的超椭圆是两种形状；
   而空环恰恰是用户最常看到的状态，只改计时态等于没改。
   去掉 border 后还顺带修掉两笔旧账：环的粗细只剩 SVG 一处（不再有 2.4 被吸附成 2.00px），
   以及 `.ring::before` 的命中区终于真的等于 24×24（原 padding box 只有 11.2，实际 19.2）。 */

.ring__arc {
  position: absolute;
  /* [V0.2.1 · 1.6] 绝对定位以 padding box 为基准：.ring 有 --ring-stroke 的边框，
     原 inset:0 让 SVG 只剩 16 − 2×描边（≈11.2px），弧比 border 环小一圈（进行时看起来缩了一个号）。
     改为「按 border box 尺寸居中摆放」：宽高直接取 --ring-size，用负外边距抵消一半，
     viewBox 16 与环 16 一一对应，弧与静态环同径，且不随边框像素对齐而变化。 */
  top: 50%;
  left: 50%;
  width: var(--ring-size);
  height: var(--ring-size);
  margin: calc(var(--ring-size) / -2) 0 0 calc(var(--ring-size) / -2);
  /* 描边中线 inset 1.2 + stroke/2 1.2 = 8，外沿恰好触界；overflow 兜住半像素裁切 */
  overflow: visible;
  /* [V0.3.6 P0] 这里**不再有任何 transform**：行进取代 rotate()，见 ring-march 的注释。
     留着 rotate 会让整个 SVG（含底轨）一起歪——那是 V0.3.3 改 squircle 时埋下的静默回归。 */
  pointer-events: none;
}

.ring__arc-track {
  fill: none;
  /* [Timing 对齐 D6] 轨道 = 状态色 × RingTrackAlpha 95/255 ≈ 0.37（MainForm.cs:2369）。
     [V0.3.6] 这是**唯一**一处底环实现：surfaces.css 里 35% 的 border-color 已删，
     两套载体在分数 DPI 下抗锯齿不同（SVG 走 subpixel、border 走像素对齐），必须收成一套。
     track 不加 transition：底轨是静态参照物，跟着 bar 一起动会显得整环在抖。 */
  stroke: color-mix(in srgb, currentColor 37%, transparent);
  stroke-width: var(--ring-stroke);
}

.ring__arc-bar {
  fill: none;
  /* [V0.3.6] 弧色 = currentColor，与 track 同源：环色只由 .ring 的 color 一处决定
     （running / warn / danger / 待命-running），SVG 里不再写死 --color-running——
     写死会让「待命态弧亮绿 + 轨道仍用 idle 的 ink」这类分叉永远修不掉。 */
  stroke: currentColor;

  stroke-width: var(--ring-stroke);
  stroke-linecap: round;
  transition:
    stroke-dashoffset var(--dur-tick) linear,
    stroke var(--dur-base) var(--ease-standard);
}

/* [V0.3.7] ended 的瞬时确认：描边加粗到 3px（原来是 `border-width: 3px`）。
   方向差别要知道：border 从盒边向**内**长，SVG 描边从中线向**两侧**长，
   所以外沿会超出 16×16 约 0.3px（`.ring__arc` 的 overflow: visible 兜得住）。
   900ms 之后 ring 回到 idle，这 0.3px 不会停留。 */

  stroke-width: 3px;

/* [V0.3.6] 暂停 = 瞬时定格：从 transition 里摘掉 dashoffset，只留颜色过渡。
   CSS transition 取**变化后状态**的 declaration，所以 running→paused 命中这条 →
   弧长在一个 rAF 内直接到位，不再用 1s 线性「长到 270°」。
   为什么必须掐掉：暂停的语义是「停住」，渐变等于告诉用户「还在动」；而且倒计时剩 20% 时
   弧会从 72° 缓缓长到 270°，看起来像进度回退了。正计时那边本来就是硬切，现在两边一致。
   注意**不能**影响倒计时 running 的每秒 tick 平滑——那条仍在 .ring__arc-bar 基准规则里。 */
.ring[data-state="paused"] .ring__arc-bar {
  transition: stroke var(--dur-base) var(--ease-standard);
}

/* [Timing 对齐 D3] 急迫态：环色切 RingUrgent 红；轨道（color-mix 取 currentColor）与弧
   （stroke: currentColor）随之一起变红，不需要再单独给 bar 写 stroke。
   暂停优先（MainForm.cs:782 先判 paused）：paused 态不切红 */
.ring[data-warn="true"]:not([data-state="paused"]) {
  color: var(--color-danger);
}

/* Blink（MainForm.cs:2388-2395）：1s 周期，0-520ms 全亮、480ms 亮度 0.615，
   作用于弧与轨道；数字不闪（裁决一实现要点） */

  0%, 52% {
    opacity: 1;
  }
  52.01%, 100% {
    opacity: 0.615;
  }

.ring[data-warn="true"]:not([data-state="paused"]) .ring__arc-bar,
.ring[data-warn="true"]:not([data-state="paused"]) .ring__arc-track {
  animation: ring-blink 1s linear infinite;
}

/* 暂停态（270° 暖橙静弧）不需要单独规则：弧色 = currentColor，而 `.ring[data-state="paused"]`
   的 color 已是 --color-warn（surfaces.css），track 的 color-mix 取同一个 currentColor，
   一处改、弧与轨同步（V0.3.6）。 */

/* [V0.3.3] 起点已在顶边中点（ARC_PATH），沿路径走一整圈仍是 360° */
/* [V0.3.6 P0] 行进 = dashoffset 沿路径推进，**不是** transform: rotate()。
   squircle（圆角方形）只有 90° 旋转对称：把 rotate() 加在 .ring__arc 上会让
   ① 底轨一起歪掉（41° 时四边既不水平也不垂直）；② 90° 弧段只在 90° 整数倍上
   与轨道曲率吻合，转到中途会浮出轨道。dashoffset 推进让弧永远贴着真实路径走，track 完全不动。 */
@keyframes ring-march {
  from {
    stroke-dashoffset: 0;
  }
  to {
    stroke-dashoffset: -100;   /* 沿路径正方向（顺时针）推进一整圈，pathLength 口径 100 */
  }
}

/* [V0.3.6] 行进只认 data-spin（正计时 running 独占；一圈 3.2s，转速口径与 Timing 一致，
   MainForm.cs:3062）。动画落在 **bar** 上，`.ring__arc` 不含任何 transform。
   **不要**退回 `[data-state="running"]`：倒计时运行时 data-state 也是 running，
   递减弧会被一起动起来，用户读不出剩余量（D1，本次核心 P0）。
   transition 只留颜色：dashoffset 交给动画（动画驱动的变化不会触发 transition，
   但把 dashoffset 从 transition 里摘掉可以省掉「切到 running 的第一帧」那次多余的插值）。 */
.ring[data-spin="true"] .ring__arc-bar {
  animation: ring-march 3.2s linear infinite;
  transition: stroke var(--dur-base) var(--ease-standard);
}

@media (prefers-reduced-motion: reduce) {
  /* [V0.3.6-F1] 三条都**必须**与基准规则同特异性（spin 0,3,0 / warn 0,4,0）：
     媒体查询本身不贡献特异性，若写成 `.ring[data-warn="true"] .ring__arc-bar`（0,3,0）
     就会被基准规则的 `animation: ring-blink` 压掉，这条 `animation: none` 变成死规则
     （CDP 实测：命中但被压，computed animationName 仍是 ring-blink）。
     同特异性 + 后加载 → 本块胜出，减动效才真的生效。不要改用 `!important` 兜底。 */
  .ring[data-spin="true"] .ring__arc-bar,
  .ring[data-warn="true"]:not([data-state="paused"]) .ring__arc-bar,
  .ring[data-warn="true"]:not([data-state="paused"]) .ring__arc-track {
    animation: none;   /* blink 退化为静态红；行进弧退化为静止的「顶部起 90°」 */
  }
}

/* 事项名可点（常用事项入口） */
.pill__name[data-interactive="true"] {
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: color var(--dur-quick) var(--ease-standard);
}

.pill__name[data-interactive="true"]:hover {
  color: var(--ink);
}

/* ------------------------------ 自定义时长（countdown-menu.md §3.2） ------------------------------ */
.menu--countdown-custom {
  width: 200px;
  animation: menu-in var(--dur-base) var(--ease-standard);
}

.cd-custom__row {
  display: flex;
  align-items: flex-end;
  gap: var(--space-2);
  padding: var(--space-1) var(--menu-item-pad-x) 0;
}

.cd-custom__field {
  display: flex;
  align-items: center;
  gap: 4px;
}

.cd-custom__input {
  width: var(--field-num-w);
  height: var(--input-h);
  padding: 0 var(--space-2);
  border-radius: var(--radius-sm);
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  color: var(--input-text);
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-size: var(--text-sm);

</style><style type="text/css" data-vite-dev-id="D:/101-Workshop/261111-Timing/src/styles/highlight.css">/* =============================================================================
 * Timing V0.3.1 — highlight.css（托盘双击 → 高亮定位小条）
 * -----------------------------------------------------------------------------
 * 托盘图标双击时 Rust 广播 `tray:highlight`，主窗读到「高亮颜色」后给
 * `.pill` 挂 `data-highlight="true"`，闪三下（0.8s × 3）自动摘掉。
 *
 * 两点约束：
 *  1. 窗口是严丝合缝贴合内容的（autoFit pad=0），外发光会被窗口边界裁掉，
 *     所以描边一律画**内侧**（inset）。
 *  2. 本文件必须在 surfaces.css **之后**加载：`.pill[data-highlight]` 与
 *     `.pill:hover` 同为 0-2-0 特异性，靠顺序压过悬停板——双击时鼠标往往就停在
 *     小条上，否则高亮会被悬停样式顶掉。
 * ========================================================================== */

.pill[data-highlight="true"] {
  border-color: transparent;
  background: color-mix(in srgb, var(--highlight-color) 24%, transparent);
  box-shadow: inset 0 0 0 2px var(--highlight-color);
  animation: pill-highlight 0.8s var(--ease-standard) 3;
}

@keyframes pill-highlight {
  0%,
  100% {
    box-shadow: inset 0 0 0 2px var(--highlight-color);
  }
  50% {
    box-shadow: inset 0 0 0 2px transparent;
  }
}
