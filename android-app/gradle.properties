org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official

# AGP 9 默认启用「内置 Kotlin」，会和显式应用的 kotlin-android 插件抢 `kotlin` 扩展，
# 报 "Cannot add extension with name 'kotlin'"。本机已验证的组合是关掉内置 Kotlin + 关新 DSL，
# 与 src-tauri/gen/android 的配置保持一致。
android.builtInKotlin=false
android.newDsl=false
