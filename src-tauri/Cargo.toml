[package]
name = "timing"
version = "0.12.1"
description = "Timing — 常驻悬浮计时条（Windows 桌面，纯本地）"
authors = ["Timing Team"]
edition = "2021"
rust-version = "1.90"

[lints.clippy]
# `panic = "abort"`（见下方 [profile.release]）：可达路径上的 unwrap/expect 直接杀进程，
# 没有 unwind 兜底、也不会留下可恢复的错误。这两条是 restriction 级 lint（默认 allow），
# 打开后让「生产可达的 panic 点」至少在 clippy 输出里可见 —— 2026-11-12 审计实测全量
# 5,660 处、其中生产可达 42 处，而此前没有任何门禁看着它们。
#
# 为什么是 warn 而不是 deny：`cargo clippy` 默认不编 test target、`#[cfg(test)]` 模块也不
# 参与，所以这两条只盯产品代码；但 42 处清完之前设 deny 会让 clippy 直接不可用。
# 收敛路径：每版按清单清一批 → 42 处归零后另立版本改 `deny`（与 check-size 的棘轮同型）。
# 注意：目前项目没有 CI clippy 步骤（npm run check 是 node 门禁），所以 warn 不会阻断构建；
# 若将来加 clippy 到门禁，禁止使用 `-D warnings` 直到这两条收敛完毕。
unwrap_used = "warn"
expect_used = "warn"

[lib]
name = "timing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 桌面壳（Spec §4 锁定 2.12.4）。
# 托盘图标 + 图片解码只在桌面 target 段开启（见下方 target 段）：`tray-icon` /
# `image-ico` 会拉进 Android 上没有实现的原生依赖，写在这里等于让移动端链接失败。
tauri = { version = "2.12.4", features = [] }

# 官方插件（Spec §4 / IPC-CONTRACT-v2 附录 A）
# v0.3：移除 tauri-plugin-sql / tauri-plugin-store —— 前端从未引用，且它们的
# capability 放行让前端可以绕过四层直接改库（ADR-015）。需要时按 ADR 回退：
# 在 [features] 里加 legacy-data-plugins，把两个依赖写回来并重新注册。
# V0.2.0 唯一新增依赖（Spec §4 / ADR-010；crates.io max_stable = 2.7.0，已核实）
tauri-plugin-notification = "2.7.0"
# V0.4.0：文件夹选择器（设置 → 同步的「选择…」）。只放行 dialog:allow-open，
# 不给文件系统读写的通用能力；路径最终仍由 Rust 侧校验。
tauri-plugin-dialog = "2.8.3"
# V0.3.3：tauri-plugin-global-shortcut 已随全局快捷键功能整体移除（ADR-022），
# 连同 p1-shortcuts feature 一起下线——不再保留占位。

# 序列化 / 错误 / 时间 / 异步
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = [
    "time",
    "rt",
    "rt-multi-thread",
    # Patina 需要（上游 tokio 1.53 全开）：select! / spawn_blocking 的 fs / 本地 socket。 
    "macros",
    "fs",
    "net",
    "sync",
    "io-util",
] }
# Rust 侧数据访问（repositories 只写 SQL + 映射）
# `migrate` 是 Patina 的数据库迁移需要（它把 .sql 编进二进制跑 Migrator）；
# 宿主原本不走 sqlx 迁移，这一位是融合后新增的，不影响宿主表。
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# [V0.11.13] 云端通道：自己发 GET / PUT + Basic Auth，不引任何 WebDAV 客户端库（ADR-061）。
# 关掉默认特性是为了不拖 OpenSSL —— 它会拖死 Android 交叉编译。TLS 走 rustls +
# `rustls-platform-verifier`（读系统根证书），这正是任务书要求的「native roots」意图；
# 任务书原文写的 `rustls-tls-native-roots` 在 reqwest 0.13 里**不存在**（0.13 删掉了
# `*-native-roots` 系列特性名），`rustls-no-provider` 是同一意图的现名。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# 加密提供者显式选 `ring`：只需 cc，Windows 与 NDK 都能编。rustls 默认的 aws-lc-rs
# 在 Windows 上要 cmake + NASM，本机构建环境没有。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# [V0.11.25] 根证书用**编译期常量**，不再走 `rustls-platform-verifier`。
# 0.11.24 及之前信任「系统根证书」，而那个后端在 Android 上必须先由 Kotlin 侧
# 初始化 context（`Expect rustls-platform-verifier to be initialized` 就是它的 panic），
# 本项目没有那个 AAR → 手机上第一次做 HTTPS 校验就 abort（`panic = "abort"`）。
# webpki-roots 是纯数据 crate：无 cc、无 JNI、两端同一份根，手机点「测试连接」不再崩。
webpki-roots = "1"

# ── Patina 子系统（vendored，上游 1.10.0 / MIT）─────────────────────────────
# 版本约束逐项照抄上游：改动版本要同步看它在哪用了什么 API。
# 与宿主重叠的 crate（serde / serde_json / chrono / tokio / sqlx / tauri）不重复声明，
# Cargo 会把特性求并集 —— 这也是宿主 tokio 只写少量特性的原因。
tauri-plugin-opener = "2"
# 上游用 0.12（`rustls-tls` 是 0.12 的特性名）；宿主的 WebDAV 用 0.13，
# 而 Cargo 不允许同名依赖声明两次 → 上游这份起别名 `reqwest012`，
# 代码里 15 处 `reqwest::` 已同步改名（集中在 `patina/platform/webdav*`）。
reqwest012 = { package = "reqwest", version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
base64 = "0.22.1"
url = "2"
psl = "=2.1.230"
quick-xml = "0.41.0"
percent-encoding = "2"
crc32fast = "1.4"
sha2 = "0.10"
tempfile = "3.27.0"
uuid = { version = "1.23.5", features = ["v4"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
csv = "1.3"
icu_locale = "2.0"
icu_plurals = { version = "2.0", features = ["compiled_data"] }
image = "0.24"
# Windows 原生探针 / 应用图标 / 任务栏主题观察。宿主用 windows-sys，两者不冲突（不同 crate）。
# 版本必须与宿主 tauri 2.12.4 依赖树里的那一份对齐：上游写 0.38.2，而 2.12.4 用 0.39.1，
# 两份并存会让 `ICoreWebView2*` 与 `windows_core::Interface` 变成**不同类型**（E0277，
# 报错信息只说「trait 未实现」，看不出是版本问题）。
#
# [V0.12.0 融合] 这三条从通用段挪到了下面的 `cfg(windows)` 段：它们只在
# `src/patina/platform/windows/` 里用，而通用段是**按 target 无条件编译**的——
# 留在通用段会让 `cargo check --target aarch64-linux-android` 去编 `windows-future`，
# 直接 `E0425: cannot find function submit in crate windows_threading` 十六条，
# 安卓端被一套 Windows API 拖死。Android 上 patina 整个模块本来就被
# `#[cfg(desktop)] mod patina;` 排除，不需要这些 crate。
# 分析导出（arrow / parquet）与更新器。两者都是上游的「数据可带走」能力，
# 编译体积大头也在 arrow 上——真要瘦身，先看 `features/export` 有没有人用。
arrow = { version = "59.3", default-features = false, features = ["ipc"] }
parquet = { version = "59.3", default-features = false, features = ["arrow"] }

# 桌面独占依赖（Android / iOS 上这三个插件没有实现，放进通用段必然链接失败）。
# 用 `cfg(not(any(android, ios)))` 而不是 `cfg(desktop)`：Cargo 的 target 段只认
# rustc 内建 cfg，`desktop` 是 tauri-build 给源码用的自定义别名，在 Cargo.toml 里无效。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# Patina 的应用更新（上游自建，走 NSIS 签名包）。只桌面需要，移动端无此概念。
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
# [V0.5.0] 数据目录迁移（PRD §4 / ARCHITECTURE §1.3）。
# 三个 crate 都已是依赖树里的传递依赖（tauri 2.12.4 / tauri-plugin-dialog 2.8.3 /
# auto-launch 0.6.0），Cargo.lock 里已有同版本 → **不引入新编译单元**。
# `dirs` 必须显式写 "7"：tauri 2.12.4 内部即 dirs 7，锁文件里同时还存在 6.0.0
# （被别的包引用），写错版本会多编一份，且两份 Windows 实现可能不同。
dirs = "7"
# 迁移失败时的三按钮原生对话框：`blocking_show` 禁止主线程调用（见 app/preboot.rs），
# 用 rfd 的同步 `show()`；事件循环尚未启动，主线程阻塞安全。
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }

# 自启旧值清理（HKCU\...\Run 与 StartupApproved\Run 两处）。只在 Windows 上编译：
# 该 crate 本身依赖 windows API，声明进跨平台段会让 macOS / Linux 构建失败。
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
# [V0.12.0 融合] Patina 的 Windows 原生探针（`patina/platform/windows/`）用的三个 crate。
# 只能挂在这里：通用段按 target 无条件编译，会把它们拖进 Android 交叉编译并直接失败。
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_WinRT",
    "Win32_System_Variant",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_Security_Credentials",
    "Win32_Media_Audio",
    "Media",
    "Media_Control",
] }
# [V0.11.13] WebDAV 应用密码的加密存储（DPAPI：`CryptProtectData` / `CryptUnprotectData`）。
# 已在依赖图里（`Cargo.lock` 有 0.61.2，经 windows-registry 引入），这里只是多开两个 feature
# → 不新增编译单元。密码明文既不进 `settings` 表也不进日志，只以密文落盘。
# [V0.11.15] 数据根切换前的剩余空间预检（`GetDiskFreeSpaceExW`）：只多开一个 feature
# → 不新增编译单元，Cargo.lock 不变。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }

[features]
default = []
# 发布构建把前端 dist 编进二进制（tauri 的 custom-protocol）；不开此特性时
# `cargo build --release` 仍会去连 devUrl（http://localhost:1420），脱离 dev server 就是白窗。
# `tauri build` 会自己带这个特性；直接用 cargo 构建发布版时必须显式打开。
custom-protocol = ["tauri/custom-protocol"]
# 上游 Patina 的两个构建标记。只声明不启用：`#[cfg(patina_coverage)]` 那处（覆盖率
# 检查点）要靠它才能编过；不声明会得到 `unexpected cfg` 警告（本项目 clippy -D warnings）。
patina_coverage = []
patina_local_build = []

# QA 测试（仅 dev profile）：提供 #[tokio::test] 异步测试运行时。
# 不进入发布产物；tokio 及 tokio-macros 已在依赖图中（勿需新增外部 crate）。
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
