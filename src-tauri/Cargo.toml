[package]
name = "tickbar"
version = "0.2.1"
description = "TickBar — 常驻悬浮计时条（Windows 桌面，纯本地）"
authors = ["TickBar Team"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "tickbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 桌面壳（Spec §4 锁定 2.12.4）；tray 为内建能力
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "image-ico"] }

# 官方插件（Spec §4 / IPC-CONTRACT-v2 附录 A）
tauri-plugin-sql = { version = "=2.4.1", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# V0.2.0 唯一新增依赖（Spec §4 / ADR-010；crates.io max_stable = 2.7.0，已核实）
tauri-plugin-notification = "2.7.0"
# [P1] 可选依赖：MVP 不注册任何热键，默认 feature 关闭
tauri-plugin-global-shortcut = { version = "2", optional = true }

# 序列化 / 错误 / 时间 / 异步
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["time"] }
# Rust 侧数据访问（repositories 只写 SQL + 映射）
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }

[features]
default = []
# [P1] 全局快捷键特性开关：解锁时才编入 tauri-plugin-global-shortcut
p1-shortcuts = ["dep:tauri-plugin-global-shortcut"]

# QA 测试（仅 dev profile）：提供 #[tokio::test] 异步测试运行时。
# 不进入发布产物；tokio 及 tokio-macros 已在依赖图中（勿需新增外部 crate）。
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
