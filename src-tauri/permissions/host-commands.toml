"$schema" = "../gen/schemas/schema.json"

# 为什么要有这份清单：Tauri 2.12 的 IPC 门禁（tauri/src/webview/mod.rs:2053）是
#   if (plugin_command.is_some() || has_app_acl_manifest || !is_local) && invoke.acl.is_none()
# 只要应用里存在任何 app 级 permission（本仓库就是分析窗的 window-commands.toml），
# 宿主自己的命令也会被要求显式放行，否则前端每条 IPC 都拿到
#   "<cmd> not allowed. Command not found"
# 界面表现为「窗口能渲染、数据全空、控制台一句日志都没有」。融合时踩过这个坑：
# 加上分析窗的清单后，宿主 79 条命令全部失效。
# 因此宿主这一批必须在这里登记，并由 scripts/check-contract.mjs 断言与
# src-tauri/src/ipc_commands.rs 的宿主段逐条一致（多一条、少一条都报错）。

[[permission]]
identifier = "host-commands"
description = "Timing 宿主应用命令面（106 条）：事项 / 计时 / 记录 / 统计 / 设置 / 主题 / 窗口 / 便利贴 / 待办 / 提醒 / 插件 / Markdown 同步 / 数据根 / 迁移 / 移动端桥 / 分类目录 / 事项标签 / AI / 打开时间统计窗口。只授权给宿主自己的窗口，分析窗口另走 activity-window-commands。"
commands.allow = [
  "accent_get",
  "accent_set",
  "archive_item",
  # [0.13.x] 事项 ↔ 应用绑定（四条）
  "bind_item_app",
  "close_note_window",
  "create_item",
  "create_record",
  "daily_status_get",
  "daily_status_set",
  # [0.14] 分类目录读口（两窗「事项分类选用」共用；桌面读活动库，手机回空目录）
  "list_category_catalog",
  "preview_category_propagation",
  "apply_category_propagation",
  # [0.13.0] 安卓应用使用统计（两条）
  "usage_stats_get",
  "usage_stats_settings",
  "data_root_change",
  "data_root_get",
  "data_root_open",
  "delete_item",
  "delete_record",
  "discard_timer",
  "get_autostart",
  # [0.13 fix] 药丸冷启动「主动取一次前台」；实现转发 infra 的窗口枚举（只读）
  "get_foreground_window",
  "get_migration_info",
  "get_reference_settings",
  "get_settings",
  "get_timer_state",
  "hide_window",
  "list_item_apps",
  "list_items",
  "list_items_for_app",
  # [0.12.3] 事项多标签（读全量 / 覆盖写一条）
  "list_item_tags",
  "set_item_tags",
  # [0.12.4] 标签目录：定义行 + 跨事项改名 / 删除（管理页与 AI 建标签）
  "list_tag_catalog",
  "create_tag_definition",
  "rename_tag",
  "delete_tag",
  # [0.12.3] AI（配置 / 测试连接 / 模型目录 / 标签建议 / 今日汇总）
  "ai_config_get",
  "ai_config_save",
  "ai_test",
  "ai_list_models",
  "ai_suggest_tags",
  "ai_daily_summary",
  "list_records",
  "main_window_rect",
  "main_work_area",
  "md_backup_export",
  "md_backup_list",
  "md_backup_open",
  "md_backup_restore",
  "md_saf_pick",
  "md_saf_status",
  # [T03] md 覆盖提醒：列待裁决冲突 / 执行一次裁决
  "md_sync_decisions",
  "md_sync_get",
  "md_sync_open",
  "md_sync_resolve",
  "md_sync_run",
  "md_sync_save",
  "md_sync_test",
  "note_create",
  "note_delete",
  "note_get",
  "note_list",
  "note_update",
  "open_legacy_dir",
  "open_note_window",
  "open_activity_window",
  "open_settings_window",
  "open_timer_window",
  "open_todos_window",
  "overlay_set",
  "overlay_status",
  "pause_timer",
  # [R1] 「启动应用」的授权入口：弹原生对话框 → 写后端授权名单。只读那条在 run_handle_custom_action
  "pick_custom_launch_target",
  "plugin_list",
  "plugin_open_dir",
  "quit_app",
  "reminder_clear",
  "reminder_pending",
  "reminder_set",
  "resolve_open_record",
  "resume_timer",
  "run_handle_custom_action",
  "save_window_position",
  "set_autostart",
  # [0.13] 绑定的应用进程退出 → 结束这一段自动接管（桌面真实现；手机 Ok(())）
  "set_bound_process_watch",
  "set_countdown_preset",
  "show_window",
  "start_countdown",
  "start_timer",
  "stats_summary",
  "stop_timer",
  "switch_item",
  "theme_get",
  "theme_set",
  "todo_create",
  "todo_create_batch",
  "todo_delete",
  "todo_list",
  "todo_start",
  "todo_toggle",
  "todo_update",
  "toggle_window",
  "unarchive_item",
  "unbind_item_app",
  "undo_stop",
  "update_item",
  "update_record",
  "update_reference_settings",
  "update_settings",
]
