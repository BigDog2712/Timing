# [T04-2 工序 2] 原有 `identifier = "mini-window-commands"`（7 条命令）已删：它是**死定义**，
# 全仓无任何 capability 引用（`activity.json` 的 `windows[]` 含 `activity` + `mini`，迷你窗
# 走的是下面这一整面授权），而那 7 条命令本来就在这一面的 allow 里 —— 删掉不改变任何窗口的
# 实际权限，只去掉一份会让人误以为「迷你窗另有更窄授权面」的清单。

# 分析窗「今日」视图的待办 / 便利贴面（第四轮 UI 落地·第二批）。
# 为什么另立一条而不是把这些命令塞进 `activity-window-commands`：那条是"整面"授权，
# 分析窗实际只用 5 条，塞进去等于把 todo_update / note_create / note_update 也给了它 ——
# ACL 是攻击面，只给用得到的。
# 各自唯一调用点（多一条都不许进 allow，写在这里是为了下一个人加命令时先看调用点）：
#   note_list          → src/platform/persistence/noteReadRepository.ts:listNoteSummaries → hooks/useTodayNotes → NotesStrip
#   todo_list          → src/platform/persistence/todoRepository.ts:listPendingTodos → hooks/useTodayTodos → TodosModule
#   todo_create        → src/platform/persistence/todoRepository.ts:createTodo（compose 回车）
#   todo_toggle        → src/platform/persistence/todoRepository.ts:toggleTodo（行首勾选）
#   todo_delete        → src/platform/persistence/todoRepository.ts:deleteTodo（行删除键 + 3s 撤销窗到期）
#   todo_update        → src/platform/persistence/todoRepository.ts:updateTodo（[0.13 · 1.7] 行编辑弹层）
#   todo_create_batch  → src/platform/persistence/todoRepository.ts:createTodoBatch（[0.13 · 1.7] 批量创建，单事务 1..=60）
# note_create / note_update **不给**：主界面便利贴条是只读的（01 §4.4.1 末段）。
[[permission]]
identifier = "activity-todo-notes"
description = "Allows the activity analysis window to read today's notes and read/write the to-do card (list, create, batch-create, update, toggle, delete only)."
commands.allow = [
  "note_list",
  "todo_list",
  "todo_create",
  "todo_create_batch",
  "todo_update",
  "todo_toggle",
  "todo_delete",
]

[[permission]]
identifier = "tool-notification-commands"
description = "Read and act only on the alert assigned to the notification window."
commands.allow = ["cmd_get_tool_presentation", "cmd_tool_presentation_action", "cmd_tool_presentation_ready"]
