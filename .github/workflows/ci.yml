name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 机械门禁：不依赖编译，几十秒内给出「架构契约有没有被破坏」的结论。
  # 单独成 job 是为了让它在 PR 上最先返回红/绿，不被构建时间拖住。
  # ---------------------------------------------------------------------------
  gates:
    name: 门禁 · 体积 / 分层 / 版本 / 契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单文件体积（≤300 行 · 白名单须带 owner + 到期日）
        run: npm run check:size

      - name: 分层依赖（6 条规则）
        run: npm run check:layers

      - name: 版本号一致性（6 处）
        run: npm run check:version

      - name: IPC 契约（命令 / 错误码 / 事件 / mock 覆盖）
        run: npm run check:contract

  frontend:
    name: 前端 · 类型 / Lint / 测试 / 构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: 单元测试（vitest · 含双端时间公式黄金用例）
        run: npm test

      - name: 生产构建
        run: npm run build

  backend:
    name: Rust · 测试 / Clippy / 格式
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 工具链钉版本，不用 `@stable`：stable 一升级就会带来新的 clippy lint，把「本地全绿」
      # 变成「CI 红 13 分钟」，而红的原因与本次改动无关（本仓实测：CI 已到 1.100.0，本地
      # 还是 1.99.0，`needless_bool` 增强了形态，一条 6 行的小函数打红整条流水线）。
      # 升级编译器是显式动作：改这里 + 改仓根 `rust-toolchain.toml` 的 channel，两处必须同版。
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 单元 / 集成测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # `-D warnings` 是刻意加的：`eprintln!` 这类回归除了被 check:layers 拦，
      # 还会在这里被编译器/剪裁器再拦一次（双保险）。
      #
      # `-A clippy::unwrap_used / expect_used` 是**存量债的显式豁免**，不是忘了开：
      # `Cargo.toml` 把这两条 restriction lint 开成 warn（为了在本地看得见），
      # 但仓内 `--all-targets` 下有 ~5,900 处（绝大多数在验收支撑与测试里）。
      # 一次性全改成 `?` 不现实，而让 CI 长期红着只会训练人忽略整条流水线。
      # 收敛是独立任务，收敛完把这两个 `-A` 删掉即可 —— 删掉之前它们必须在这儿，
      # 写在这儿是为了让「豁免」这件事可见，而不是悄悄不跑。
      - name: Clippy（warning 视为失败 · unwrap/expect 存量豁免）
        run: >
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --
          -D warnings
          -A clippy::unwrap_used -A clippy::expect_used

      # 没有 `cargo fmt --check`：它与本仓的「单文件 ≤300 行」硬约束**不可同时满足**。
      # 2026-11-13 实测：全仓 `cargo fmt` 后有 14 个原本合规的文件被换行推到 300 行以上
      # （`scripts/size-allowlist.json` 从 150 条涨到 164 条），而该基线是棘轮、明确
      # 不许为「变绿」新增豁免。两条规则二选一，本项目选 300 行（它有架构含义：
      # 单文件可一次读完）；格式化因此不是门禁项，改代码时按现有风格手写。
