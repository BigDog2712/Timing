name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 机械门禁：不依赖编译，几十秒内给出「架构契约有没有被破坏」的结论。
  # 单独成 job 是为了让它在 PR 上最先返回红/绿，不被构建时间拖住。
  # ---------------------------------------------------------------------------
  gates:
    name: 门禁 · 体积 / 分层 / 版本 / 契约 / 品牌 / 变异
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 放第一步是刻意的：它判的是"这一串名字本身接得对不对"，1 秒内出结论。
      # 若某个 check 脚本没接进链、或链里引用了不存在的脚本，后面十几步的耗时
      # 都白花了，而且最后给出的红会指向某个无辜的门禁而不是接线错误。
      - name: 接线自检（scripts / check 链 / verify / 本文件 四处名字不许漂）
        run: npm run check:ci-parity

      - name: 单文件体积（≤600 有效行 · 冻结基线棘轮）
        run: npm run check:size

      - name: 分层依赖（10 条规则）
        run: npm run check:layers

      - name: 版本号一致性（6 处）
        run: npm run check:version

      # 漂移的症状是「新人和代理照着过期数字做方案」：不报错、不变红，只在几天后
      # 表现为「按文档写的做完了，但不对」。数字从源码现算，这里只核文档侧的措辞。
      - name: 文档数字（版号 / 命令数 / 迁移支数 / 错误码数不许过期）
        run: npm run check:doc-numbers

      - name: IPC 契约（命令 / 错误码 / 事件 / mock 覆盖）
        run: npm run check:contract

      # 下面两步是「大规模改名」唯一兜得住的防线：改路径/改前缀时 cargo check 与 tsc
      # 都会全绿，只有 brand 能发现「名字改漏了」、只有 mutation 能发现「注入残留没撤」。
      # 2026-11-15 去 Patina 化重构前补上（此前 CI 只跑 4 步，这两步全靠本地自觉）。
      - name: 品牌残留（Timing 以外的旧名不许出现在源码与文案）
        run: npm run check:brand

      - name: 变异注入残留（MUTATION 标记不许留在盘上）
        run: npm run check:mutation

      # 这条从 2026-11 起就在本地链里，却一直没进 CI：窗口 label / 入口页 / 前端常量
      # 三处漂移的症状全是静默的（IPC 全拒但界面正常、打包后 404），而它纯读文件、
      # 不依赖编译，放这个 job 里 1 秒内给结论。CI 是唯一在干净环境里跑的判据面，
      # 「本地跑过」不能当它的验收证据。
      - name: 运行时标识符（窗口 label / 入口页 / 前端常量三处一致）
        run: npm run check:runtime-ids

      # [T04-4] 存储键改名判据：patina:/patina. 字面量只住注册表、24 槽双向一致、
      # 迁移只复制不删、迁移零循环。键改名的失效形态是静默的（读不到⇒默认值），
      # 这条把"谁又写了一个 patina 字面量"变成当场红。
      - name: 存储键注册表（patina 字面量只住声明行 + 槽账本双向一致）
        run: npm run check:storage-keys

      # [T05] 活动库与数据目录改名：这一批改的是**已落盘坐标**，改错了不会报错，
      # 只在用户那边表现为「历史突然空了、应用一切正常」。七条判据全部是结构断言
      # （旧目录名不再作为路径片段 / `*.db` 不得经 fs::copy / 旧路径永不删 /
      # 结构上不可能落完成标记 / 不许按字样改写库内数据 / 两个布局开关都接上 / 防空转）。
      - name: de-Patina 活动库落点（7 条判据：路径片段 / VACUUM INTO / 不删 / 不写标记 / 不 REPLACE / 双开关 / 防空转）
        run: npm run check:de-patina

  frontend:
    name: 前端 · 类型 / Lint / 测试 / 构建
    runs-on: windows-latest
    steps:
      # vitest 里有 source test 用 `git show/diff` 对照 T04 基线提交（fcbbab5），
      # 浅克隆取不到祖先对象 → 必须全量历史（2026-11-13 CI 实测 4 条红即此因）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: 单元测试（vitest · 含双端时间公式黄金用例）
        run: npm test

      - name: 生产构建
        run: npm run build

  backend:
    name: Rust · 测试 / Clippy / 格式
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 工具链钉版本，不用 `@stable`：stable 一升级就会带来新的 clippy lint，把「本地全绿」
      # 变成「CI 红 13 分钟」，而红的原因与本次改动无关（本仓实测：CI 已到 1.100.0，本地
      # 还是 1.99.0，`needless_bool` 增强了形态，一条 6 行的小函数打红整条流水线）。
      # 升级编译器是显式动作：改这里 + 改仓根 `rust-toolchain.toml` 的 channel，两处必须同版。
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 单元 / 集成测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # `-D warnings` 是刻意加的：`eprintln!` 这类回归除了被 check:layers 拦，
      # 还会在这里被编译器/剪裁器再拦一次（双保险）。
      #
      # `-A clippy::unwrap_used / expect_used` 是**存量债的显式豁免**，不是忘了开：
      # `Cargo.toml` 把这两条 restriction lint 开成 warn（为了在本地看得见），
      # 但仓内 `--all-targets` 下有 ~5,900 处（绝大多数在验收支撑与测试里）。
      # 一次性全改成 `?` 不现实，而让 CI 长期红着只会训练人忽略整条流水线。
      # 收敛是独立任务，收敛完把这两个 `-A` 删掉即可 —— 删掉之前它们必须在这儿，
      # 写在这儿是为了让「豁免」这件事可见，而不是悄悄不跑。
      - name: Clippy（warning 视为失败 · unwrap/expect 存量豁免）
        run: >
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --
          -D warnings
          -A clippy::unwrap_used -A clippy::expect_used

      # 没有 `cargo fmt --check`：这是**独立决定**，不是「与行数限制不可兼得」。
      # 那条老理由（2026-11-13：全仓 fmt 把 14 个合规文件推过 300 行）已随上限放宽到
      # 600 失效 —— 2026-11-19 实测：0 个文件越 600、36 个存量超限文件无一增长、
      # 835 个 .rs 里只有 13 个会被改写。仍然不加，是因为纯排版 diff 会混进功能提交，
      # 而本仓靠 diff 可读性做审查；要放开就单开一批（cargo fmt + 单独提交 + 重记基线）。

  android:
    name: Android · Rust target / Debug APK assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 安装 Android API 36 与 NDK
        run: sdkmanager "platforms;android-36" "ndk;29.0.14206865"

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-aarch64

      - name: 安装前端依赖
        run: npm ci

      # 使用仓库脚本完成 mobile 前端构建、Android Rust 编译、.so 复制与 Gradle assemble。
      # Debug 只使用自动生成的调试签名，不读取 keystore/secrets，也不发布 APK。
      - name: 构建 arm64 Android Debug APK
        run: node scripts/android-apk.mjs --debug
