<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0E0F12" />
    <title>TickBar · 悬浮时间记录</title>
    <script>
      /* 防白闪引导脚本（K-1 / ADR-012）：样式加载前同步解析并写入 <html data-theme>。
         只设 data-theme —— 令牌文件 :root 内已给 --bg 默认值 + html{background:var(--bg)}，
         故即使 CSS 未全量就绪也不会白闪。system 模式用系统偏好解析。 */
      (function () {
        try {
          var mode = 'dark';
          try {
            var cached = localStorage.getItem('tickbar.theme');
            if (cached === 'dark' || cached === 'light' || cached === 'system') mode = cached;
          } catch (e) {}
          var resolved = mode;
          if (mode === 'system') {
            var dark = true;
            try {
              dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            } catch (e) {}
            resolved = dark ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute('content', resolved);
        } catch (e) {
          /* 任何异常都回落到默认深色（html 已带 data-theme="dark"） */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
